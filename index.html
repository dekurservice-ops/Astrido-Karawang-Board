<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI Service Advisor - Profesional Dashboard</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  
  <style>
    body { background-color: #F8FAFC; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;
    const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine } = Recharts;

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjDV-yEwUjHbaI87ofYzeFGIzLlDO78TLJeUDj6Q9XujozrQaIoED0JcHC664QZg548g/exec";
    const uid = () => Math.random().toString(36).slice(2, 10);

    function seedData() {
      return {
        meta: { sa: "13C110 - DEDE KURNIAWAN", periods: ["Juli 2026", "Agustus 2026", "September 2026", "Oktober 2026", "November 2026", "Desember 2026"] },
        categories: [
          {
            id: uid(), name: "Business Process", weight: 60,
            subItems: [
              { id: uid(), name: "Unit CPUS (SBE + GRP)", unit: "unit", subWeight: 25, target: 0, actual: 0, inverse: false },
              { id: uid(), name: "Lead Time (ALL UE)", unit: "menit", subWeight: 10, target: 0, actual: 0, inverse: true },
              { id: uid(), name: "FIR (Fix It Right)", unit: "%", subWeight: 0, target: 0, actual: 0, inverse: false },
              { id: uid(), name: "OTD (excl. TWC & RTJ)", unit: "%", subWeight: 10, target: 0, actual: 0, inverse: false },
              { id: uid(), name: "% Pelanggan di Engagement", unit: "%", subWeight: 10, target: 90, actual: 90, inverse: false },
              { id: uid(), name: "% Saran Service / CPUS", unit: "%", subWeight: 15, target: 50, actual: 50, inverse: false },
              { id: uid(), name: "% CAI Saran Service", unit: "%", subWeight: 15, target: 65, actual: 65, inverse: false },
              { id: uid(), name: "% SA Retention", unit: "%", subWeight: 15, target: 80, actual: 80, inverse: false },
            ],
          },
          {
            id: uid(), name: "Financial", weight: 30,
            subItems: [
              { id: uid(), name: "Penjualan Jasa", unit: "Rp", subWeight: 50, target: 0, actual: 12649228, inverse: false },
              { id: uid(), name: "Penjualan Spare Part", unit: "Rp", subWeight: 25, target: 0, actual: 19716943, inverse: false },
              { id: uid(), name: "Penjualan Bahan", unit: "Rp", subWeight: 15, target: 0, actual: 17725639, inverse: false },
              { id: uid(), name: "Penjualan Sublet", unit: "Rp", subWeight: 10, target: 0, actual: 4655242, inverse: false },
            ],
          },
          {
            id: uid(), name: "CS", weight: 10,
            subItems: [
              { id: uid(), name: "NPS Per SA - TTB", unit: "point", subWeight: 50, target: 0, actual: 0, inverse: false },
              { id: uid(), name: "Kuantity VOC Per SA", unit: "point", subWeight: 25, target: 0, actual: 0, inverse: false },
              { id: uid(), name: "NPS Real Promoter", unit: "point", subWeight: 25, target: 0, actual: 0, inverse: false },
            ],
          }
        ],
      };
    }

    function achievement(sub) {
      const t = Number(sub.target);
      const a = Number(sub.actual);
      if (!t || Number.isNaN(t)) return 0;
      if (sub.inverse) {
        if (!a || Number.isNaN(a)) return 0;
        return Math.min(130, (t / a) * 100); 
      }
      if (Number.isNaN(a)) return 0;
      return Math.min(130, (a / t) * 100); 
    }
    
    function subScore(sub, categoryWeight) {
      const ach = achievement(sub);
      return ((Number(sub.subWeight) || 0) / 100) * ((Number(categoryWeight) || 0) / 100) * ach;
    }
    
    function categoryScore(cat) {
      return cat.subItems.reduce((s, sub) => s + subScore(sub, cat.weight), 0);
    }
    
    function overallScore(categories) {
      return categories.reduce((s, c) => s + categoryScore(c), 0);
    }

    function statusStyle(pct) {
      if (pct >= 100) return { hex: "#10B981", text: "text-emerald-700", bg: "bg-emerald-100", border: "border-emerald-200", label: "Target Utama Tercapai (100%+)" };
      if (pct >= 85) return { hex: "#3B82F6", text: "text-blue-700", bg: "bg-blue-100", border: "border-blue-200", label: "Tahap Aman Level 2 (≥ 85%)" };
      if (pct >= 80) return { hex: "#F59E0B", text: "text-amber-700", bg: "bg-amber-100", border: "border-amber-200", label: "Tahap Aman Level 1 (≥ 80%)" };
      return { hex: "#EF4444", text: "text-red-700", bg: "bg-red-100", border: "border-red-200", label: "Perlu Perhatian (< 80%)" };
    }

    function fmt(n) {
      const num = Number(n);
      if (Number.isNaN(num) || num === 0) return "0";
      return num.toLocaleString("id-ID");
    }

    function parseFormattedNumber(val) {
      if (!val) return 0;
      if (typeof val === 'number') return val;
      let s = String(val).replace(/[^0-9,-]/g, '');
      s = s.replace(/,/g, '.');
      return parseFloat(s) || 0;
    }

    function Gauge({ value, size = 260 }) {
      const clamped = Math.max(0, Math.min(130, value));
      const angle = -180 + (clamped / 130) * 180;
      const r = (size / 2) - 35;
      const cx = size / 2;
      const cy = size / 2 + 10;
      const rad = (angle * Math.PI) / 180;
      const needleLen = r - 10;
      const nx = cx + needleLen * Math.cos(rad);
      const ny = cy + needleLen * Math.sin(rad);

      const st = statusStyle(value);

      return (
        <div className="flex flex-col items-center justify-center relative w-full overflow-hidden py-2">
          <svg width={size} height={size / 2 + 45} viewBox={`0 0 ${size} ${size / 2 + 45}`} className="overflow-visible">
            <defs>
              <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stopColor="#EF4444" />
                <stop offset="61%" stopColor="#F59E0B" />
                <stop offset="77%" stopColor="#3B82F6" />
                <stop offset="100%" stopColor="#10B981" />
              </linearGradient>
            </defs>
            <path d={`M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`} stroke="#E2E8F0" strokeWidth={14} fill="none" strokeLinecap="round" />
            <path d={`M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`} stroke="url(#gaugeGrad)" strokeWidth={14} fill="none" strokeLinecap="round" strokeDasharray={`${Math.PI * r}`} strokeDashoffset={`${Math.PI * r * (1 - clamped / 130)}`} />
            <line x1={cx} y1={cy} x2={nx} y2={ny} stroke="#1E293B" strokeWidth={4} strokeLinecap="round" />
            <circle cx={cx} cy={cy} r={9} fill="#FFFFFF" stroke={st.hex} strokeWidth={4} />
            <text x={cx} y={cy + 38} textAnchor="middle" fontFamily="Plus Jakarta Sans" fontSize="30" fontWeight="800" fill="#0F172A">{value.toFixed(1)}%</text>
          </svg>
        </div>
      );
    }

    function ChartTooltip({ active, payload, label }) {
      if (!active || !payload || !payload.length) return null;
      const val = payload[0].value;
      const st = statusStyle(val);
      return (
        <div className="bg-white border border-slate-200 rounded-lg p-3 shadow-lg font-mono">
          <div className="text-xs text-slate-500 mb-1">{label}</div>
          <div className="text-sm font-bold" style={{ color: st.hex }}>{val.toFixed(2)}%</div>
        </div>
      );
    }

    const SubItemRow = ({ sub, catWeight, activePeriod, onSave }) => {
        const [isLocked, setIsLocked] = useState(true);
        const isRp = sub.unit?.toLowerCase() === 'rp';
        
        const [targetNum, setTargetNum] = useState(Number(sub.target) || 0);
        const [targetStr, setTargetStr] = useState(isRp && sub.target > 0 ? targetNum.toLocaleString('id-ID') : (sub.target ? sub.target.toString() : ''));
        
        const [actualNum, setActualNum] = useState(Number(sub.actual) || 0);
        const [actualStr, setActualStr] = useState(isRp && sub.actual > 0 ? actualNum.toLocaleString('id-ID') : (sub.actual ? sub.actual.toString() : ''));

        useEffect(() => {
            const t = Number(sub.target) || 0;
            const a = Number(sub.actual) || 0;
            setTargetNum(t);
            setActualNum(a);
            setTargetStr(t > 0 ? (isRp ? t.toLocaleString('id-ID') : t.toString()) : '');
            setActualStr(a > 0 ? (isRp ? a.toLocaleString('id-ID') : a.toString()) : '');
            setIsLocked(true);
        }, [sub.target, sub.actual, activePeriod, isRp]);

        const handleTargetChange = (e) => {
            setTargetStr(e.target.value);
            setTargetNum(parseFormattedNumber(e.target.value));
        };

        const handleActualChange = (e) => {
            setActualStr(e.target.value);
            setActualNum(parseFormattedNumber(e.target.value));
        };

        const handleToggleLock = () => {
            if (!isLocked) {
                onSave(sub.id, targetNum, actualNum);
            }
            setIsLocked(!isLocked);
        };

        const currentSub = { ...sub, target: targetNum, actual: actualNum };
        const ach = achievement(currentSub);
        const sc = subScore(currentSub, catWeight);
        const st = statusStyle(ach);

        return (
            <tr className="border-b border-slate-100 last:border-0 hover:bg-slate-50/70 transition-colors">
                <td className="py-4 px-5">
                    <div className="font-semibold text-slate-800 text-sm leading-tight">{sub.name}</div>
                    {sub.inverse && <div className="text-[10px] text-slate-400 mt-1 uppercase tracking-wider">Inverse Metric</div>}
                </td>
                <td className="py-4 px-4 text-center text-sm font-mono text-slate-500">{sub.unit}</td>
                <td className="py-4 px-4 text-center text-sm font-medium text-slate-600">{sub.subWeight}%</td>
                
                <td className="py-4 px-4 text-right">
                    {isLocked ? (
                        <span className="font-mono text-sm font-medium text-slate-700">
                            {targetNum === 0 ? '-' : (isRp ? `Rp ${fmt(targetNum)}` : fmt(targetNum))}
                        </span>
                    ) : (
                        <div className="relative inline-block w-full max-w-[140px]">
                            {isRp && <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none">Rp</span>}
                            <input 
                                type="text" 
                                value={targetStr}
                                onChange={handleTargetChange}
                                placeholder="0"
                                className={`w-full text-right font-mono text-sm border-2 border-amber-400 bg-amber-50 rounded-lg py-1.5 px-3 focus:ring-4 focus:ring-amber-400/20 outline-none transition-all ${isRp ? 'pl-8' : ''}`} 
                            />
                        </div>
                    )}
                </td>

                <td className="py-4 px-4 text-right">
                    {isLocked ? (
                        <span className="font-mono text-sm font-medium text-slate-700">
                            {actualNum === 0 ? '-' : (isRp ? `Rp ${fmt(actualNum)}` : fmt(actualNum))}
                        </span>
                    ) : (
                        <div className="relative inline-block w-full max-w-[140px]">
                            {isRp && <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none">Rp</span>}
                            <input 
                                type="text" 
                                value={actualStr}
                                onChange={handleActualChange}
                                placeholder="0"
                                className={`w-full text-right font-mono text-sm border-2 border-emerald-400 bg-emerald-50 rounded-lg py-1.5 px-3 focus:ring-4 focus:ring-emerald-400/20 outline-none transition-all ${isRp ? 'pl-8' : ''}`} 
                            />
                        </div>
                    )}
                </td>

                <td className="py-4 px-4 text-center">
                    <span className={`px-2.5 py-1.5 rounded-full text-xs font-bold ${st.bg} ${st.text} border ${st.border}`}>
                        {ach.toFixed(1)}%
                    </span>
                </td>
                <td className="py-4 px-4 text-center font-mono font-bold text-slate-800 text-base">
                    {sc.toFixed(2)}
                </td>
                <td className="py-4 px-4 text-center">
                    <button 
                        onClick={handleToggleLock} 
                        className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition-all shadow-sm
                            ${isLocked 
                                ? 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100' 
                                : 'bg-emerald-500 border border-emerald-600 text-white hover:bg-emerald-600 hover:shadow-md'
                            }`}
                    >
                        {isLocked ? '🔓 Edit' : '🔒 Simpan'}
                    </button>
                </td>
            </tr>
        );
    };

    function App() {
      const [periods, setPeriods] = useState(["Juli 2026", "Agustus 2026", "September 2026", "Oktober 2026", "November 2026", "Desember 2026"]);
      const [active, setActive] = useState("Juli 2026");
      
      const [currentData, setCurrentData] = useState(seedData());
      const [syncStatus, setSyncStatus] = useState("Menghubungkan Google Sheets...");

      const fetchDataFromAppsScript = useCallback(() => {
        setSyncStatus("⏳ Sinkronisasi Apps Script...");
        fetch(APPS_SCRIPT_URL)
          .then(res => res.json())
          .then(data => {
            if (data && data.categories) {
              setCurrentData(data);
              if (data.meta && data.meta.periods && data.meta.periods.length > 0) {
                setPeriods(data.meta.periods);
                setActive(data.meta.periods[0]);
              }
              setSyncStatus("✅ Terhubung Google Sheets");
            } else {
              setSyncStatus("⚠️ Format Data Kosong");
            }
          })
          .catch(err => {
            console.error("Gagal sinkronisasi", err);
            setSyncStatus("⚠️ Gagal Akses Web App");
          });
      }, []);

      useEffect(() => {
        fetchDataFromAppsScript();
      }, [fetchDataFromAppsScript]);

      const saveSubItemToSheets = (catId, subId, newTarget, newActual) => {
          const updatedCategories = currentData.categories.map(c => {
              if (c.id !== catId) return c;
              return {
                  ...c,
                  subItems: c.subItems.map(s => s.id === subId ? { ...s, target: newTarget, actual: newActual } : s)
              };
          });
          const newData = { ...currentData, categories: updatedCategories };
          setCurrentData(newData);
          
          setSyncStatus("⏳ Menyimpan ke Sheets...");
          
          fetch(APPS_SCRIPT_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ...newData, activePeriod: active })
          })
          .then(() => {
              setSyncStatus("✅ Tersimpan di Google Sheets");
          })
          .catch(err => {
              console.error("Error post", err);
              setSyncStatus("⚠️ Gagal Menyimpan ke Sheets");
          });
      };

      const totalCatWeight = useMemo(() => currentData ? currentData.categories.reduce((s, c) => s + (Number(c.weight) || 0), 0) : 0, [currentData]);
      const total = useMemo(() => currentData ? overallScore(currentData.categories) : 0, [currentData]);
      const overallStatus = statusStyle(total);

      const chartData = useMemo(() => {
          return periods.map(p => ({ name: p, score: p === active ? total : 0 }));
      }, [periods, active, total]);

      const focusList = useMemo(() => {
        if (!currentData) return [];
        const rows = [];
        currentData.categories.forEach((cat) => {
          cat.subItems.forEach((sub) => {
            const ach = achievement(sub);
            const potential = (Number(sub.subWeight) || 0) / 100 * (Number(cat.weight) || 0) / 100 * Math.max(0, 100 - ach);
            if (potential > 0.05 && (Number(cat.weight) || 0) > 0 && (Number(sub.subWeight) || 0) > 0) {
              rows.push({ cat: cat.name, name: sub.name, ach, potential, target: sub.target, actual: sub.actual, unit: sub.unit });
            }
          });
        });
        return rows.sort((a, b) => b.potential - a.potential).slice(0, 4);
      }, [currentData]);

      return (
        <div className="min-h-screen text-slate-800 font-sans pb-16">
          <div className="max-w-6xl mx-auto px-4 pt-8">
            
            {/* Header Area */}
            <div className="flex flex-col md:flex-row justify-between items-start md:items-end gap-4 mb-6">
              <div>
                <h1 className="text-3xl font-extrabold tracking-tight text-slate-900 mb-1">KPI Service Advisor</h1>
                <div className="text-slate-500 font-medium">{currentData.meta?.sa || "13C110 - DEDE KURNIAWAN"}</div>
              </div>
              <div className="flex flex-col items-end gap-2">
                <div className="flex items-center gap-2">
                    <button 
                        onClick={fetchDataFromAppsScript}
                        title="Tarik data terbaru dari Google Sheets"
                        className="inline-flex items-center justify-center p-1.5 bg-white border border-slate-200 hover:bg-slate-100 rounded-full transition-colors shadow-sm text-base cursor-pointer"
                    >
                        🔄
                    </button>
                    <div className="inline-flex items-center gap-2 px-3 py-1.5 bg-white border border-slate-200 rounded-full shadow-sm text-xs font-semibold text-slate-600">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                      {syncStatus}
                    </div>
                </div>
                
                <div className="flex items-center gap-2 mt-1">
                  <select 
                    value={active} 
                    onChange={(e) => setActive(e.target.value)}
                    className="bg-white border border-slate-300 text-slate-700 rounded-lg px-4 py-2 text-sm font-semibold shadow-sm outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer"
                  >
                    {periods.map((p) => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
              </div>
            </div>

            {/* Disclaimer Banner */}
            <div className="bg-emerald-50 border-l-4 border-emerald-500 rounded-r-xl p-4 mb-8 shadow-sm">
                <div className="flex gap-3">
                    <span className="text-xl">💡</span>
                    <p className="text-sm text-emerald-800 leading-relaxed font-medium">
                        <strong>Sinkronisasi Kolom Periode Google Sheets.</strong> Pilihan periode otomatis merujuk ke data kolom A dari spreadsheet Anda (Juli s.d. Desember 2026).
                    </p>
                </div>
            </div>

            {/* Top Cards (Gauge & Chart) */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                
                {/* Score Summary Card */}
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 flex flex-col items-center justify-center lg:col-span-1">
                    <div className="w-full flex justify-center py-2">
                      <Gauge value={total} size={250} />
                    </div>
                    <div className="text-sm font-bold text-slate-400 mt-1 tracking-wide uppercase">Skor Total — {active}</div>
                    
                    <div className="w-full mt-6 space-y-3">
                        <div className={`w-full text-center py-2.5 rounded-lg border font-bold text-sm ${overallStatus.bg} ${overallStatus.text} ${overallStatus.border}`}>
                            {overallStatus.label}
                        </div>
                        <div className="flex justify-between items-center text-xs font-semibold px-2">
                            <span className="text-slate-500">Bobot KPI:</span>
                            <span className={Math.abs(totalCatWeight - 100) < 0.1 ? "text-emerald-600" : "text-amber-600"}>{totalCatWeight}%</span>
                        </div>
                    </div>
                </div>

                {/* Line Chart Card */}
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 lg:col-span-2 flex flex-col">
                    <div className="flex items-center gap-2 mb-4">
                        <span className="text-xl">📈</span>
                        <h2 className="text-lg font-bold text-slate-800">Grafik Kinerja Bulanan</h2>
                    </div>
                    <div className="w-full flex-grow min-h-[220px]">
                        <ResponsiveContainer>
                          <LineChart data={chartData} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>
                            <CartesianGrid stroke="#F1F5F9" vertical={false} />
                            <XAxis dataKey="name" tick={{ fill: "#64748B", fontSize: 11, fontFamily: "JetBrains Mono" }} axisLine={{ stroke: "#E2E8F0" }} tickLine={false} />
                            <YAxis tick={{ fill: "#64748B", fontSize: 11, fontFamily: "JetBrains Mono" }} axisLine={false} tickLine={false} domain={[0, 130]} />
                            <ReferenceLine y={100} stroke="#10B981" strokeDasharray="4 4" opacity={0.6} />
                            <ReferenceLine y={85} stroke="#3B82F6" strokeDasharray="4 4" opacity={0.5} />
                            <Tooltip content={<ChartTooltip />} cursor={{ stroke: '#E2E8F0', strokeWidth: 2 }} />
                            <Line type="monotone" dataKey="score" stroke="#10B981" strokeWidth={3} dot={{ r: 5, fill: "#10B981", stroke: "#FFFFFF", strokeWidth: 2 }} activeDot={{ r: 7 }} />
                          </LineChart>
                        </ResponsiveContainer>
                    </div>
                </div>
            </div>

            {/* Rekomendasi Prioritas */}
            {focusList.length > 0 && (
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 mb-8">
                  <div className="flex items-center gap-2 mb-4">
                    <span className="text-xl">🎯</span>
                    <h2 className="text-lg font-bold text-slate-800">Prioritas Peningkatan Kinerja</h2>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {focusList.map((f, i) => {
                        const st = statusStyle(f.ach);
                        const isRp = f.unit?.toLowerCase() === 'rp';
                        return (
                          <div key={i} className="flex items-center justify-between bg-slate-50 border border-slate-200 rounded-xl p-4">
                            <div>
                              <div className="text-sm font-bold text-slate-800">{i + 1}. {f.name}</div>
                              <div className="text-xs text-slate-500 mt-1">
                                  Aktual: {isRp ? 'Rp ' : ''}{fmt(f.actual)} / Target: {isRp ? 'Rp ' : ''}{fmt(f.target)}
                              </div>
                            </div>
                            <div className="flex flex-col items-end gap-1">
                              <span className={`px-2 py-1 rounded-md text-xs font-bold ${st.bg} ${st.text}`}>{f.ach.toFixed(1)}%</span>
                              <span className="text-xs font-bold text-emerald-600">+{f.potential.toFixed(2)} poin</span>
                            </div>
                          </div>
                        );
                      })}
                  </div>
                </div>
            )}

            {/* KPI Cards (Categories) */}
            <div className="space-y-8">
              {currentData.categories.map((cat) => {
                const catScore = categoryScore(cat);
                return (
                  <div key={cat.id} className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                    
                    {/* Category Header */}
                    <div className="bg-slate-800 px-6 py-4 flex flex-col md:flex-row justify-between md:items-center gap-3">
                        <h3 className="text-xl font-bold text-white tracking-tight">{cat.name}</h3>
                        <div className="flex items-center gap-6">
                            <div className="text-slate-300 text-sm">Bobot: <span className="font-bold text-white text-base ml-1">{cat.weight}%</span></div>
                            <div className="text-slate-300 text-sm">Skor Kategori: <span className="font-bold text-emerald-400 text-base ml-1">{catScore.toFixed(2)}</span></div>
                        </div>
                    </div>

                    {/* SubItems Table */}
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse min-w-[900px]">
                            <thead className="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wider font-bold border-b border-slate-200">
                                <tr>
                                   <th className="px-5 py-4 w-[28%]">Indikator KPI</th>
                                   <th className="px-4 py-4 text-center w-[8%]">Satuan</th>
                                   <th className="px-4 py-4 text-center w-[8%]">Bobot</th>
                                   <th className="px-4 py-4 text-right w-[15%]">Target</th>
                                   <th className="px-4 py-4 text-right w-[15%]">Aktual</th>
                                   <th className="px-4 py-4 text-center w-[10%]">Capaian</th>
                                   <th className="px-4 py-4 text-center w-[8%]">Skor</th>
                                   <th className="px-4 py-4 text-center w-[8%]">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {cat.subItems.map((sub) => (
                                    <SubItemRow 
                                        key={sub.id + active}
                                        sub={sub} 
                                        catWeight={cat.weight} 
                                        activePeriod={active}
                                        onSave={(subId, target, actual) => saveSubItemToSheets(cat.id, subId, target, actual)}
                                    />
                                ))}
                            </tbody>
                        </table>
                    </div>
                  </div>
                );
              })}
            </div>
            
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
