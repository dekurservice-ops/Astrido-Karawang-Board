<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPI Service Advisor - Profesional Dashboard</title>
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  
  <style>
    body { background-color: #F8FAFC; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { height: 6px; width: 6px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;
    const { ComposedChart, Bar, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, ReferenceLine, Legend } = Recharts;

    // Kumpulan URL CSV Publik dari setiap Tab Google Spreadsheet Anda
    const CSV_URLS = [
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEIpigrJgpJqlewVJg7PWWOxugLStPiycw7zijnRc4370xBB5As2URRQPwInTYyk1mB2L0ZHZcQVr8/pub?gid=2073594475&single=true&output=csv", // Business Process
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEIpigrJgpJqlewVJg7PWWOxugLStPiycw7zijnRc4370xBB5As2URRQPwInTYyk1mB2L0ZHZcQVr8/pub?gid=721702211&single=true&output=csv",  // Financial
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEIpigrJgpJqlewVJg7PWWOxugLStPiycw7zijnRc4370xBB5As2URRQPwInTYyk1mB2L0ZHZcQVr8/pub?gid=0&single=true&output=csv"           // CS
    ];

    const uid = () => Math.random().toString(36).slice(2, 10);

    function getInitialData() {
      return {
        meta: { sa: "13C110 - DEDE KURNIAWAN", periods: ["Juli 2026", "Agustus 2026"] },
        categories: [
          {
            id: uid(), name: "Business Process", weight: 60,
            subItems: [
              { id: uid(), name: "Unit CPUS (SBE + GRP)", unit: "unit", subWeight: 25, target: 0, actual: 0, inverse: false },
              { id: uid(), name: "Lead Time (ALL UE)", unit: "menit", subWeight: 10, target: 0, actual: 0, inverse: true },
              { id: uid(), name: "FIR (Fix It Right)", unit: "%", subWeight: 0, target: 0, actual: 0, inverse: false },
              { id: uid(), name: "OTD (excl. TWC & RTJ)", unit: "%", subWeight: 10, target: 0, actual: 0, inverse: false },
              { id: uid(), name: "% Pelanggan di Engagement", unit: "%", subWeight: 10, target: 0, actual: 0, inverse: false },
              { id: uid(), name: "% Saran Service / CPUS", unit: "%", subWeight: 15, target: 0, actual: 0, inverse: false },
              { id: uid(), name: "% CAI Saran Service", unit: "%", subWeight: 15, target: 0, actual: 0, inverse: false },
              { id: uid(), name: "% SA Retention", unit: "%", subWeight: 15, target: 0, actual: 0, inverse: false },
            ],
          },
          {
            id: uid(), name: "Financial", weight: 30,
            subItems: [
              { id: uid(), name: "Penjualan Jasa", unit: "Rp", subWeight: 50, target: 0, actual: 0, inverse: false },
              { id: uid(), name: "Penjualan Spare Part", unit: "Rp", subWeight: 25, target: 0, actual: 0, inverse: false },
              { id: uid(), name: "Penjualan Bahan", unit: "Rp", subWeight: 15, target: 0, actual: 0, inverse: false },
              { id: uid(), name: "Penjualan Sublet", unit: "Rp", subWeight: 10, target: 0, actual: 0, inverse: false },
            ],
          },
          {
            id: uid(), name: "CS", weight: 10,
            subItems: [
              { id: uid(), name: "NPS Per SA - TTB", unit: "%", subWeight: 50, target: 0, actual: 0, inverse: false },
              { id: uid(), name: "Kuantity VOC Per SA", unit: "%", subWeight: 25, target: 0, actual: 0, inverse: false },
              { id: uid(), name: "NPS Real Promoter", unit: "%", subWeight: 25, target: 0, actual: 0, inverse: false },
            ],
          }
        ],
      };
    }

    function achievement(sub) {
      const t = Number(sub.target);
      const a = Number(sub.actual);
      if (!t || Number.isNaN(t)) return 0;
      if (sub.inverse) {
        if (!a || Number.isNaN(a)) return 0;
        return Math.min(130, (t / a) * 100); 
      }
      if (Number.isNaN(a)) return 0;
      return Math.min(130, (a / t) * 100); 
    }
    
    function subScore(sub, categoryWeight) {
      const ach = achievement(sub);
      return ((Number(sub.subWeight) || 0) / 100) * ((Number(categoryWeight) || 0) / 100) * ach;
    }
    
    function categoryScore(cat) {
      return cat.subItems.reduce((s, sub) => s + subScore(sub, cat.weight), 0);
    }
    
    function overallScore(categories) {
      return categories.reduce((s, c) => s + categoryScore(c), 0);
    }

    function statusStyle(pct) {
      if (pct >= 100) return { hex: "#10B981", text: "text-emerald-700", bg: "bg-emerald-100", border: "border-emerald-200", label: "Target Utama Tercapai (100%+)" };
      if (pct >= 85) return { hex: "#3B82F6", text: "text-blue-700", bg: "bg-blue-100", border: "border-blue-200", label: "Tahap Aman Level 2 (≥ 85%)" };
      if (pct >= 80) return { hex: "#F59E0B", text: "text-amber-700", bg: "bg-amber-100", border: "border-amber-200", label: "Tahap Aman Level 1 (≥ 80%)" };
      return { hex: "#EF4444", text: "text-red-700", bg: "bg-red-100", border: "border-red-200", label: "Perlu Perhatian (< 80%)" };
    }

    function formatValue(val, unit) {
      const num = Number(val);
      if (Number.isNaN(num) || num === 0) return "0";
      if (unit?.toLowerCase() === 'rp') {
        return `Rp ${num.toLocaleString("id-ID")}`;
      }
      if (unit === '%') {
        return `${num.toLocaleString("id-ID")}%`;
      }
      return num.toLocaleString("id-ID");
    }

    function parseFormattedNumber(val) {
      if (!val) return 0;
      if (typeof val === 'number') return val;
      let s = String(val).replace(/[^0-9,-]/g, '');
      s = s.replace(/,/g, '.');
      return parseFloat(s) || 0;
    }

    function Gauge({ value, size = 220 }) {
      const clamped = Math.max(0, Math.min(130, value));
      const angle = -180 + (clamped / 130) * 180;
      const r = (size / 2) - 30;
      const cx = size / 2;
      const cy = size / 2 + 10;
      const rad = (angle * Math.PI) / 180;
      const needleLen = r - 10;
      const nx = cx + needleLen * Math.cos(rad);
      const ny = cy + needleLen * Math.sin(rad);

      const st = statusStyle(value);

      return (
        <div className="flex flex-col items-center justify-center relative w-full overflow-hidden py-1">
          <svg width={size} height={size / 2 + 35} viewBox={`0 0 ${size} ${size / 2 + 35}`} className="overflow-visible">
            <defs>
              <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stopColor="#EF4444" />
                <stop offset="61%" stopColor="#F59E0B" />
                <stop offset="77%" stopColor="#3B82F6" />
                <stop offset="100%" stopColor="#10B981" />
              </linearGradient>
            </defs>
            <path d={`M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`} stroke="#E2E8F0" strokeWidth={12} fill="none" strokeLinecap="round" />
            <path d={`M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`} stroke="url(#gaugeGrad)" strokeWidth={12} fill="none" strokeLinecap="round" strokeDasharray={`${Math.PI * r}`} strokeDashoffset={`${Math.PI * r * (1 - clamped / 130)}`} />
            <line x1={cx} y1={cy} x2={nx} y2={ny} stroke="#1E293B" strokeWidth={3} strokeLinecap="round" />
            <circle cx={cx} cy={cy} r={7} fill="#FFFFFF" stroke={st.hex} strokeWidth={3} />
            <text x={cx} y={cy + 32} textAnchor="middle" fontFamily="Plus Jakarta Sans" fontSize="26" fontWeight="800" fill="#0F172A">{value.toFixed(2)}%</text>
          </svg>
        </div>
      );
    }

    function ChartTooltip({ active, payload, label }) {
      if (!active || !payload || !payload.length) return null;
      const val = payload[0].value;
      const st = statusStyle(val);
      return (
        <div className="bg-white border border-slate-200 rounded-lg p-2.5 shadow-lg font-mono text-xs">
          <div className="text-slate-500 mb-0.5">{label}</div>
          <div className="font-bold" style={{ color: st.hex }}>Skor: {val.toFixed(2)}%</div>
        </div>
      );
    }

    const SubItemRow = ({ sub, catWeight, onSave }) => {
        const [isLocked, setIsLocked] = useState(true);
        const [targetNum, setTargetNum] = useState(Number(sub.target) || 0);
        const [targetStr, setTargetStr] = useState(sub.target ? String(sub.target) : '');
        const [actualNum, setActualNum] = useState(Number(sub.actual) || 0);
        const [actualStr, setActualStr] = useState(sub.actual ? String(sub.actual) : '');

        useEffect(() => {
            setTargetNum(Number(sub.target) || 0);
            setTargetStr(sub.target ? String(sub.target) : '');
            setActualNum(Number(sub.actual) || 0);
            setActualStr(sub.actual ? String(sub.actual) : '');
        }, [sub.target, sub.actual]);

        const handleTargetChange = (e) => {
            setTargetStr(e.target.value);
            setTargetNum(parseFormattedNumber(e.target.value));
        };

        const handleActualChange = (e) => {
            setActualStr(e.target.value);
            setActualNum(parseFormattedNumber(e.target.value));
        };

        const handleToggleLock = () => {
            if (!isLocked) {
                onSave(sub.id, targetNum, actualNum);
            }
            setIsLocked(!isLocked);
        };

        const currentSub = { ...sub, target: targetNum, actual: actualNum };
        const ach = achievement(currentSub);
        const sc = subScore(currentSub, catWeight);
        const st = statusStyle(ach);

        return (
            <tr className="border-b border-slate-100 last:border-0 hover:bg-slate-50/70 transition-colors">
                <td className="py-2.5 px-4">
                    <div className="font-semibold text-slate-800 text-xs leading-tight">{sub.name}</div>
                    {sub.inverse && <span className="text-[9px] text-slate-400 uppercase tracking-wider">Inverse</span>}
                </td>
                <td className="py-2.5 px-3 text-center text-xs font-mono text-slate-500">{sub.unit}</td>
                <td className="py-4 px-3 text-center text-xs font-medium text-slate-600">{sub.subWeight}%</td>
                
                <td className="py-2.5 px-3 text-right">
                    {isLocked ? (
                        <span className="font-mono text-xs font-medium text-slate-700">
                            {targetNum === 0 ? '-' : formatValue(targetNum, sub.unit)}
                        </span>
                    ) : (
                        <input 
                            type="text" 
                            value={targetStr}
                            onChange={handleTargetChange}
                            placeholder="0"
                            className="w-full max-w-[120px] text-right font-mono text-xs border border-amber-400 bg-amber-50 rounded px-2 py-1 outline-none" 
                        />
                    )}
                </td>

                <td className="py-2.5 px-3 text-right">
                    {isLocked ? (
                        <span className="font-mono text-xs font-medium text-slate-700">
                            {actualNum === 0 ? '-' : formatValue(actualNum, sub.unit)}
                        </span>
                    ) : (
                        <input 
                            type="text" 
                            value={actualStr}
                            onChange={handleActualChange}
                            placeholder="0"
                            className="w-full max-w-[120px] text-right font-mono text-xs border border-emerald-400 bg-emerald-50 rounded px-2 py-1 outline-none" 
                        />
                    )}
                </td>

                <td className="py-2.5 px-3 text-center">
                    <span className={`px-2 py-0.5 rounded text-[11px] font-bold ${st.bg} ${st.text}`}>
                        {ach.toFixed(1)}%
                    </span>
                </td>
                <td className="py-2.5 px-3 text-center font-mono font-bold text-slate-800 text-xs">
                    {sc.toFixed(2)}
                </td>
                <td className="py-2.5 px-3 text-center">
                    <button 
                        onClick={handleToggleLock} 
                        className={`px-2.5 py-1 rounded text-[11px] font-bold transition-all cursor-pointer
                            ${isLocked 
                                ? 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100' 
                                : 'bg-emerald-500 text-white hover:bg-emerald-600'
                            }`}
                    >
                        {isLocked ? '🔓 Edit' : '🔒 Simpan'}
                    </button>
                </td>
            </tr>
        );
    };

    function App() {
      const [periods] = useState(["Juli 2026", "Agustus 2026"]);
      const [active, setActive] = useState("Juli 2026");
      const [dataMap, setDataMap] = useState({
        "Juli 2026": getInitialData(),
        "Agustus 2026": getInitialData()
      });
      const [syncStatus, setSyncStatus] = useState("Menghubungkan Semua Tab CSV...");

      const fetchAllCSVData = useCallback(() => {
        setSyncStatus("⏳ Memuat Semua Tab Sheets...");
        
        const newMap = {
          "Juli 2026": getInitialData(),
          "Agustus 2026": getInitialData()
        };

        let completedRequests = 0;

        CSV_URLS.forEach((url) => {
          Papa.parse(url, {
            download: true,
            header: true,
            complete: (results) => {
              completedRequests++;
              if (results && results.data) {
                results.data.forEach(row => {
                  const rowPeriode = row["Periode"]?.trim();
                  const rowIndikator = row["Indikator KPI"]?.trim();
                  const targetVal = parseFormattedNumber(row["Target"]);
                  const actualVal = parseFormattedNumber(row["Aktual"]);

                  if (rowPeriode && rowIndikator && newMap[rowPeriode]) {
                    newMap[rowPeriode].categories.forEach(cat => {
                      cat.subItems.forEach(sub => {
                        if (sub.name.toLowerCase() === rowIndikator.toLowerCase()) {
                          sub.target = targetVal;
                          sub.actual = actualVal;
                        }
                      });
                    });
                  }
                });
              }

              if (completedRequests === CSV_URLS.length) {
                setDataMap(newMap);
                setSyncStatus("✅ Terhubung Google Sheets");
              }
            },
            error: (err) => {
              completedRequests++;
              console.error("Gagal sinkronisasi salah satu CSV", err);
              if (completedRequests === CSV_URLS.length) {
                setDataMap(newMap);
                setSyncStatus("✅ Terhubung Google Sheets");
              }
            }
          });
        });
      }, []);

      useEffect(() => {
        fetchAllCSVData();
      }, [fetchAllCSVData]);

      const currentData = dataMap[active];

      const saveSubItem = (catId, subId, newTarget, newActual) => {
          const updatedCategories = currentData.categories.map(c => {
              if (c.id !== catId) return c;
              return {
                  ...c,
                  subItems: c.subItems.map(s => s.id === subId ? { ...s, target: newTarget, actual: newActual } : s)
              };
          });
          setDataMap(prev => ({
              ...prev,
              [active]: { ...currentData, categories: updatedCategories }
          }));
      };

      const historyData = useMemo(() => {
        return periods.map(p => ({
          name: p,
          score: overallScore(dataMap[p].categories)
        }));
      }, [dataMap, periods]);

      const totalCatWeight = useMemo(() => currentData.categories.reduce((s, c) => s + (Number(c.weight) || 0), 0), [currentData]);
      const total = useMemo(() => overallScore(currentData.categories), [currentData]);
      const overallStatus = statusStyle(total);

      const focusList = useMemo(() => {
        const rows = [];
        currentData.categories.forEach((cat) => {
          cat.subItems.forEach((sub) => {
            const ach = achievement(sub);
            const potential = (Number(sub.subWeight) || 0) / 100 * (Number(cat.weight) || 0) / 100 * Math.max(0, 100 - ach);
            if (potential > 0.05 && (Number(cat.weight) || 0) > 0 && (Number(sub.subWeight) || 0) > 0) {
              rows.push({ cat: cat.name, name: sub.name, ach, potential, target: sub.target, actual: sub.actual, unit: sub.unit });
            }
          });
        });
        return rows.sort((a, b) => b.potential - a.potential).slice(0, 4);
      }, [currentData]);

      return (
        <div className="min-h-screen text-slate-800 font-sans pb-12">
          <div className="max-w-6xl mx-auto px-4 pt-6">
            
            {/* Header Area */}
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 mb-4">
              <div>
                <h1 className="text-2xl font-extrabold tracking-tight text-slate-900">KPI Service Advisor</h1>
                <div className="text-xs text-slate-500 font-medium">{currentData.meta.sa}</div>
              </div>
              <div className="flex items-center gap-2">
                <button 
                    onClick={fetchAllCSVData}
                    title="Segarkan data dari Google Sheets"
                    className="p-1.5 bg-white border border-slate-200 hover:bg-slate-100 rounded-full transition-colors shadow-sm text-sm cursor-pointer"
                >
                    🔄
                </button>
                <div className="flex items-center gap-1.5 px-3 py-1 bg-white border border-slate-200 rounded-full shadow-sm text-xs font-semibold text-slate-600">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  {syncStatus}
                </div>
                <select 
                  value={active} 
                  onChange={(e) => setActive(e.target.value)}
                  className="bg-white border border-slate-300 text-slate-700 rounded-lg px-3 py-1.5 text-xs font-semibold shadow-sm outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer"
                >
                  {periods.map((p) => <option key={p} value={p}>{p}</option>)}
                </select>
              </div>
            </div>

            {/* Top Cards (Gauge & Chart) */}
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-6">
                
                {/* Score Summary Card */}
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 flex flex-col items-center justify-center lg:col-span-1">
                    <div className="w-full flex justify-center py-1">
                      <Gauge value={total} size={210} />
                    </div>
                    <div className="text-xs font-bold text-slate-400 mt-0.5 tracking-wide uppercase">Skor Total — {active}</div>
                    
                    <div className="w-full mt-4 space-y-2">
                        <div className={`w-full text-center py-2 rounded-lg border font-bold text-xs ${overallStatus.bg} ${overallStatus.text} ${overallStatus.border}`}>
                            {overallStatus.label}
                        </div>
                        <div className="flex justify-between items-center text-[11px] font-semibold px-1">
                            <span className="text-slate-500">Bobot KPI:</span>
                            <span className={Math.abs(totalCatWeight - 100) < 0.1 ? "text-emerald-600" : "text-amber-600"}>{totalCatWeight}%</span>
                        </div>
                    </div>
                </div>

                {/* Combined Bar & Line Chart Card */}
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 lg:col-span-2 flex flex-col">
                    <div className="flex items-center gap-1.5 mb-2">
                        <span className="text-base">📈</span>
                        <h2 className="text-sm font-bold text-slate-800">Grafik Kinerja Bulanan (Batang & Garis)</h2>
                    </div>
                    <div className="w-full flex-grow min-h-[190px]">
                        <ResponsiveContainer>
                          <ComposedChart data={historyData} margin={{ top: 5, right: 5, left: -25, bottom: 0 }}>
                            <CartesianGrid stroke="#F1F5F9" vertical={false} />
                            <XAxis dataKey="name" tick={{ fill: "#64748B", fontSize: 10, fontFamily: "JetBrains Mono" }} axisLine={{ stroke: "#E2E8F0" }} tickLine={false} />
                            <YAxis tick={{ fill: "#64748B", fontSize: 10, fontFamily: "JetBrains Mono" }} axisLine={false} tickLine={false} domain={[0, 130]} />
                            <ReferenceLine y={100} stroke="#10B981" strokeDasharray="3 3" opacity={0.6} />
                            <ReferenceLine y={85} stroke="#3B82F6" strokeDasharray="3 3" opacity={0.5} />
                            <Tooltip content={<ChartTooltip />} cursor={{ fill: '#F1F5F9' }} />
                            <Legend wrapperStyle={{ fontSize: '11px', paddingTop: '4px' }} />
                            <Bar dataKey="score" name="Capaian Aktual (%)" fill="#3B82F6" radius={[4, 4, 0, 0]} barSize={28} />
                            <Line type="monotone" dataKey="score" name="Tren Kinerja" stroke="#10B981" strokeWidth={2.5} dot={{ r: 4, fill: "#10B981", stroke: "#FFFFFF", strokeWidth: 2 }} activeDot={{ r: 6 }} />
                          </ComposedChart>
                        </ResponsiveContainer>
                    </div>
                </div>
            </div>

            {/* Rekomendasi Prioritas (Compact Grid) */}
            {focusList.length > 0 && (
                <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-4 mb-6">
                  <div className="flex items-center gap-1.5 mb-3">
                    <span className="text-base">🎯</span>
                    <h2 className="text-sm font-bold text-slate-800">Prioritas Peningkatan Kinerja</h2>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3">
                      {focusList.map((f, i) => {
                        const st = statusStyle(f.ach);
                        return (
                          <div key={i} className="bg-slate-50 border border-slate-200 rounded-lg p-3 flex flex-col justify-between">
                            <div>
                              <div className="text-xs font-bold text-slate-800 line-clamp-1">{i + 1}. {f.name}</div>
                              <div className="text-[11px] text-slate-500 mt-1">
                                  Aktual: {formatValue(f.actual, f.unit)}
                              </div>
                            </div>
                            <div className="flex items-center justify-between mt-2 pt-2 border-t border-slate-200">
                              <span className={`px-1.5 py-0.5 rounded text-[10px] font-bold ${st.bg} ${st.text}`}>{f.ach.toFixed(1)}%</span>
                              <span className="text-[11px] font-bold text-emerald-600">+{f.potential.toFixed(2)} pts</span>
                            </div>
                          </div>
                        );
                      })}
                  </div>
                </div>
            )}

            {/* KPI Cards (Categories) */}
            <div className="space-y-4">
              {currentData.categories.map((cat) => {
                const catScore = categoryScore(cat);
                return (
                  <div key={cat.id} className="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                    
                    {/* Category Header */}
                    <div className="bg-slate-800 px-4 py-2.5 flex flex-col sm:flex-row justify-between sm:items-center gap-2">
                        <h3 className="text-sm font-bold text-white tracking-tight">{cat.name}</h3>
                        <div className="flex items-center gap-4 text-xs">
                            <span className="text-slate-300">Bobot: <strong className="text-white ml-0.5">{cat.weight}%</strong></span>
                            <span className="text-slate-300">Skor: <strong className="text-emerald-400 ml-0.5">{catScore.toFixed(2)}</strong></span>
                        </div>
                    </div>

                    {/* SubItems Table */}
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse min-w-[850px]">
                            <thead className="bg-slate-50 text-slate-500 text-[10px] uppercase tracking-wider font-bold border-b border-slate-200">
                                <tr>
                                   <th className="px-4 py-2.5 w-[28%]">Indikator KPI</th>
                                   <th className="px-3 py-2.5 text-center w-[8%]">Satuan</th>
                                   <th className="px-3 py-2.5 text-center w-[8%]">Bobot</th>
                                   <th className="px-3 py-2.5 text-right w-[15%]">Target</th>
                                   <th className="px-3 py-2.5 text-right w-[15%]">Aktual</th>
                                   <th className="px-3 py-2.5 text-center w-[10%]">Capaian</th>
                                   <th className="px-3 py-2.5 text-center w-[8%]">Skor</th>
                                   <th className="px-3 py-2.5 text-center w-[8%]">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {cat.subItems.map((sub) => (
                                    <SubItemRow 
                                        key={sub.id}
                                        sub={sub} 
                                        catWeight={cat.weight} 
                                        onSave={(subId, target, actual) => saveSubItem(cat.id, subId, target, actual)}
                                    />
                                ))}
                            </tbody>
                        </table>
                    </div>
                  </div>
                );
              })}
            </div>
            
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
